name: Docker Publish

# Tag- and manual-triggered ONLY. This workflow never runs on a plain push to
# main or on pull requests:
#   - `push` is scoped to `v*` tags.
#   - `workflow_dispatch` lets the owner build/push on demand (optional tag).
# The actual `push: true` is additionally guarded per-step so an image is only
# pushed for a tag or an explicit dispatch.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (defaults to the git short SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR (GitHub Container Registry) — geo-api primary registry. Scaleway is
  # eradicated from the geo-api publish path (owner directive : geo ne dépend
  # plus de SCW ; le registre SCW reste up pour matchid). Published via
  # GITHUB_TOKEN (see the build job's `packages: write` permission).
  IMAGE: ghcr.io/rhanka/geo-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Build the workspace before the image so a broken build fails fast and
      # cheaply (the Dockerfile also runs npm ci + build, but this surfaces
      # errors without the Docker layer overhead).
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          GITHUB_REF: ${{ github.ref }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            version="${version#v}"
            tags="${IMAGE}:${version},${IMAGE}:latest"
          elif [[ -n "${DISPATCH_TAG:-}" ]]; then
            tags="${IMAGE}:${DISPATCH_TAG}"
          else
            tags="${IMAGE}:$(git rev-parse --short HEAD)"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Will build: ${tags}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Bake the git commit as the OCI revision label ("which commit runs in prod?").
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Push only for a tag build or an explicit manual dispatch. Anything
          # else (should not occur given the triggers) builds without pushing.
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Anonymous public-pull probe (NON-BLOCKING warning). A newly-created
      # user-scoped GHCR package is PRIVATE by default, so this logs whether
      # ghcr.io/rhanka/geo-api is anonymously pullable — the owner then decides
      # the visibility / pull mechanism (make-public vs a GHCR pull-secret). It
      # NEVER fails the build; the workloads keep geo-registry-pull until cutover.
      - name: Probe GHCR anonymous pull (non-blocking)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          repo="rhanka/geo-api"
          first="${{ steps.tags.outputs.tags }}"
          first="${first%%,*}"
          ref_tag="${first##*:}"
          tok=$(curl -s "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty')
          if [ -z "$tok" ]; then
            echo "::warning::GHCR ${repo}: anonymous token refused — package is PRIVATE (default for a new user package). Owner visibility decision needed before workloads can pull anonymously. Build NOT failed."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" "https://ghcr.io/v2/${repo}/manifests/${ref_tag}")
          if [ "$code" = "200" ]; then
            echo "::notice::GHCR ${repo}:${ref_tag} anonymously pullable (200) — public read confirmed; workloads can drop geo-registry-pull at cutover."
          else
            echo "::warning::GHCR ${repo}:${ref_tag} anonymous manifest HTTP ${code} — NOT publicly pullable yet. Owner visibility decision needed. Build NOT failed."
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # geo-capture — le runner de capture qui tourne sur le cluster.
  #
  # ⚠️ CETTE IMAGE N'AVAIT AUCUN PIPELINE. Celle que le cluster executait,
  # `rg.fr-par.scw.cloud/sentropic-geo/geo-capture:6140585ed14a-pvbacklog-v1`,
  # avait ete construite A LA MAIN et poussee sur Scaleway. Consequence: elle est
  # restee bloquee sur du code ANTERIEUR au correctif df491b69 (serialisation des
  # Lease en microtime), et ses CronJobs echouaient en HTTP 400 toutes les deux
  # minutes sans que personne ne puisse les mettre a jour de facon rejouable.
  # C'est la meme maladie que le CronJob `geo-pv-backlog` disparu du namespace et
  # que le quota absent du depot: du reel qui n'existe nulle part en versionne.
  #
  # ⭐ GHCR UNIQUEMENT, PAS DE SCALEWAY. Personne ne tire encore cette image
  # depuis Scaleway; la doubler recreerait exactement la dependance croisee que le
  # proprietaire demande de fermer. Une image neuve n'a aucune raison de naitre du
  # mauvais cote.
  #
  # Job SEPARE et non matrice avec geo-api: l'equipe k8s demande que le passage de
  # geo-api a GHCR soit une PR distincte, apres que sa bascule kubeconfig soit
  # verte. Les melanger ferait basculer les deux ensemble.
  build-and-push-capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/rhanka/geo-capture
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le SHA court, jamais `:latest` seul. Un tag mouvant peut pointer ailleurs
      # demain sans que rien ne le signale — c'est ce qui tient sentropic-preprod
      # en panne. Le deploiement, lui, s'epingle PAR DIGEST (sortie `digest`).
      - name: Compute capture image tag
        id: tags
        run: |
          short="$(git rev-parse --short HEAD)"
          requested="${{ inputs.tag }}"
          tag="${requested:-$short}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/rhanka/geo-capture:${tag}" >> "$GITHUB_OUTPUT"
          echo "Will build: ghcr.io/rhanka/geo-capture:${tag}"

      - name: Build and push geo-capture
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/capture-job/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le digest est ce qu'on epingle dans les manifestes. L'afficher ici evite
      # d'avoir a le retrouver a la main dans les logs du build.
      - name: Report immutable digest
        run: |
          echo "ghcr.io/rhanka/geo-capture@${{ steps.build.outputs.digest }}"
