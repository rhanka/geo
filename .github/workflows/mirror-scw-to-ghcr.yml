name: Mirror SCW image to GHCR (one-shot)

# Outil one-shot de migration : copie une image SCW EXACTE (par digest) vers GHCR
# en PRÉSERVANT le digest (docker buildx imagetools create = copie du manifest,
# byte-pour-byte, digest identique). Sert à sortir de SCW les workloads geo-api
# épinglés par digest (ex. cptaq-serve) sans changer d'image.
# ⚠ Branche jetable — JAMAIS mergée sur main. Le seul usage transitoire de SCW_SECRET_KEY.
on:
  workflow_dispatch:
    inputs:
      src:
        description: "Image SCW source (rg.fr-par.scw.cloud/...@sha256:...)"
        required: true
        default: "rg.fr-par.scw.cloud/sentropic-geo/geo-api@sha256:8e572cb5e16a04509738b71a2019d141958cd20ed2c704a7bb0bf3ff5e0bc827"
      dest_tag:
        description: "Tag GHCR destination (le digest source est préservé)"
        required: true
        default: "ghcr.io/rhanka/geo-api:cptaq-serve-abefa1e8"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway (pull source)
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Log in to GHCR (push dest)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror SCW -> GHCR (digest préservé)
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${{ github.event.inputs.dest_tag }}" "${{ github.event.inputs.src }}"

      - name: Verify — digests SCW et GHCR identiques
        run: |
          set -euo pipefail
          SRC_D="$(docker buildx imagetools inspect "${{ github.event.inputs.src }}" --format '{{.Manifest.Digest}}')"
          DST_D="$(docker buildx imagetools inspect "${{ github.event.inputs.dest_tag }}" --format '{{.Manifest.Digest}}')"
          echo "::notice::SRC (SCW)  digest = ${SRC_D}"
          echo "::notice::DEST (GHCR) digest = ${DST_D}"
          test "${SRC_D}" = "${DST_D}" || { echo "::error::digests différents — le mirror n'a pas préservé l'image"; exit 1; }
          echo "::notice::OK — image copiée à l'identique sur GHCR (${DST_D})"
