name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 0 dependency (node builtins only): the backup retention/manifest/copy logic
      # and its CronJob/RBAC/CD wiring, against an in-memory versioned S3 fake.
      - name: Validate daily prod backup logic (offline selftest)
        run: node deploy/ci/backup/backup-daily.selftest.mjs
      - name: Guard registry migration
        run: node scripts/check-registry-policy.mjs
      # poppler-utils fournit `pdftotext`, que l'image de scrape embarque
      # (api/Dockerfile) et dont dépend l'extraction des PDF de PV : sans lui,
      # l'extraction rend du vide EN SILENCE. Le runner GitHub ne l'a pas par
      # défaut, alors qu'un test le vérifie explicitement — le CI doit donc
      # offrir la même chaîne d'outils que la production, plutôt que d'affaiblir
      # le test qui garde ce contrat.
      - name: Install poppler-utils (pdftotext)
        # Bornage anti-hang (mirror apt lent/down) : timeout 300s + retries + per-request
        # timeout → un mirror lent est retry, un mirror down fail-fast en 5 min (pas 40+).
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 300 apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: node scripts/run-workspaces.mjs check
      - name: Test
        run: npm test
      # Les tests des outils `scripts/` (node:test) ne sont PAS dans les workspaces,
      # donc `npm test` (run-workspaces) ne les couvre pas — step explicite pour que
      # le contrat du générateur/résolveur (déterminisme + branche DRIFT + invariants)
      # soit ENFORCÉ en CI, pas seulement committé.
      - name: Test (scripts/)
        run: npm run test:scripts
      # Self-tests hors ligne de la bascule préprod (CLI bascule.mjs : gardes, docs-sync
      # incrémental, cron hebdomadaire) et du contrat e2e (served-ids.mjs), jusqu'ici
      # committés mais jamais lancés par la CI.
      - name: Validate bascule preprod logic (offline selftests)
        run: |
          node deploy/ci/bascule-preprod/bascule.selftest.mjs
          node deploy/ci/bascule-preprod/served-ids.selftest.mjs
      - name: Install Chromium for MapLibre mount e2e
        run: npx playwright install --with-deps chromium
      - name: Mount e2e (real MapLibre and Chromium)
        run: npm run test:mount-e2e --workspace @sentropic/geo-map-engine
