name: CD Preprod

# Adoption du plan de déploiement plateforme (ARCH-17/BR-55, mécanisme B push-CI, ADR-0028).
# Sur push `main` touchant l'image ou les manifests preprod : build geo-api (→ DIGEST) →
# résout le digest dans l'overlay preprod → `kubectl apply -k` → rollout status.
#
# Path-filtré : ne tourne QUE si l'image (packages/geo, Dockerfile) ou les manifests
# preprod changent → pas de re-deploy à chaque merge non-pertinent. Le digest est
# content-hash (immuable) : un code inchangé re-résout le même digest (idempotent).
#
# ⚠ Séparé du RELEASE tag-driven (`docker-publish.yml` + `npm-publish.yml`, domaine
# geo-socle, intouché). Ici = déploiement continu preprod, PAS la publication versionnée.
#
# GATE OWNER sur les chemins MANUELS seulement (job `approve`, Environment `geo-preprod`,
# required-reviewer = owner) : un workflow_dispatch, ou TOUTE relance (github.run_attempt > 1,
# y compris la relance d'un run push), attend l'approbation owner. Motif : un jeton « Actions:
# write » (ex. GEO_DISPATCH_TOKEN de l'orchestrateur immo) peut dispatcher ET relancer tous
# les workflows du dépôt, sur n'importe quelle branche existante. La 1re tentative d'un run
# push reste AUTOMATIQUE (0 clic). L'approbation est liée à la tentative (outputs.attempt ==
# github.run_attempt) : relancer deploy-preprod seul ne réutilise jamais une approbation
# antérieure. Après un échec : « Re-run all jobs » (« Re-run failed jobs » saute le déploiement).
# La concurrency est portée par deploy-preprod (pas par le workflow) : un run en attente
# d'approbation ne bloque jamais le chemin push automatique.
on:
  push:
    branches: [main]
    paths:
      - "packages/geo/**"
      - "Dockerfile"
      - "deploy/k8s/base/**"
      - "deploy/k8s/overlays/preprod/**"
      - "Makefile"
      - ".github/workflows/cd-preprod.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # GHCR — geo-api sorti de Scaleway (déploiement preprod sur GHCR via GITHUB_TOKEN,
  # package public). Le registre SCW reste up pour matchid, geo n'en dépend plus.
  IMAGE: ghcr.io/rhanka/geo-api

jobs:
  # GATE OWNER — chemins manuels seulement (dispatch, ou relance > 1). Sauté à la 1re
  # tentative d'un run push. N'exécute rien avant l'approbation ; 0 checkout, 0 scope de jeton.
  approve:
    if: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: geo-preprod
    permissions: {}
    outputs:
      attempt: ${{ steps.bind.outputs.attempt }}
    steps:
      - name: Lie l'approbation owner à cette tentative
        id: bind
        run: |
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "owner-approved: event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA} attempt=${GITHUB_RUN_ATTEMPT} triggering_actor=${GITHUB_TRIGGERING_ACTOR}" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-preprod:
    needs: approve
    runs-on: ubuntu-latest
    # COFFRE `geo-preprod-cd` (0 reviewer, branche de déploiement = main SEULE) : porte
    # KUBE_CONFIG_DATA_PREPROD → lisible UNIQUEMENT depuis main. La gate owner reste sur
    # `approve` (Environment `geo-preprod`) ; ce coffre n'ajoute aucune approbation.
    environment: geo-preprod-cd
    # GATE : tourne ssi (a) `approve` a réussi DANS CETTE TENTATIVE, ou (b) 1re tentative d'un
    # run non-dispatch (push), où `approve` est sauté. `!cancelled()` empêche le success()
    # implicite de propager le saut d'`approve` sur ce job.
    if: >-
      ${{ !cancelled() &&
      ((needs.approve.result == 'success' && needs.approve.outputs.attempt == github.run_attempt) ||
      (needs.approve.result == 'skipped' && github.event_name != 'workflow_dispatch' && github.run_attempt == '1')) }}
    concurrency:
      group: cd-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Build workspace avant l'image : un build cassé échoue vite (idem docker-publish).
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # C2a — build + push geo-api sur GHCR (same-digest) via GITHUB_TOKEN.
      # Tag mouvant `main-<sha>` pour la traçabilité ; le DÉPLOIEMENT s'épingle PAR DIGEST (sortie).
      - name: Build and push geo-api (→ digest immuable)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Bake the git commit as the OCI revision label ("which commit runs?").
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:main-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kubectl + kustomize
        run: |
          curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          install -m 0755 kustomize /usr/local/bin/kustomize

      # Kubeconfig = SA least-privilege ns-scopé geo-preprod (poc-k8s), base64 en GH secret.
      - name: Configure kubeconfig (preprod)
        env:
          KUBE_CONFIG_DATA_PREPROD: ${{ secrets.KUBE_CONFIG_DATA_PREPROD }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA_PREPROD" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # Fail-fast clair si le secret est absent/vide (sinon l'échec surface plus tard,
          # opaque, au `kubectl apply`). Vert-par-omission = rouge.
          test -s "$HOME/.kube/config" || { echo "::error::KUBE_CONFIG_DATA_PREPROD absent ou vide — kubeconfig requis pour deploy-preprod"; exit 1; }

      # Anti-ImagePullBackOff : refuse d'appliquer un manifest référençant une image absente.
      - name: Assert image digest en registry
        run: |
          docker buildx imagetools inspect "${IMAGE}@${{ steps.build.outputs.digest }}" > /dev/null

      # C2b — résout le digest dans l'overlay + apply + rollout status (self-gate santé).
      - name: Deploy preprod
        run: make k8s-deploy-preprod GEO_DIGEST="${{ steps.build.outputs.digest }}"

      # Auto-diagnostic sur échec (rollout timeout, apply, …) : surface le POURQUOI du pod
      # sans check manuel cluster (esprit repo « vert par omission = rouge »). Chaque dump
      # tolère l'absence de droit/ressource (|| true) — le SA least-priv lit pods/deployments/
      # sealedsecrets/events (zéro verbe secrets). N'échoue jamais lui-même (if: failure()).
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          echo "::group::pods (STATUS = ImagePullBackOff / Pending / CrashLoop / Running-not-Ready ?)"
          kubectl -n geo-preprod get pods -o wide || true
          echo "::endgroup::"
          echo "::group::describe pods geo-api"
          kubectl -n geo-preprod describe pods -l app.kubernetes.io/name=geo-api || true
          echo "::endgroup::"
          echo "::group::deployment geo-api"
          kubectl -n geo-preprod get deployment geo-api -o wide || true
          echo "::endgroup::"
          echo "::group::sealedsecrets (Synced ?)"
          kubectl -n geo-preprod get sealedsecrets || true
          echo "::endgroup::"
          echo "::group::events (30 derniers)"
          kubectl -n geo-preprod get events --sort-by=.lastTimestamp | tail -30 || true
          echo "::endgroup::"
