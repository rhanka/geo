# bascule-bundle-cd — CD-NATIVE apply of the geo bascule PROD bundle ON MERGE.
#
# CLONE geo of radar-immobilier:.github/workflows/bascule-bundle-cd.yml (i-cond recipe).
# This workflow applies the WHOLE bundle (SealedSecrets geo-pra-writer-prod + geo-db-ro-prod,
# Job db-ro-role-provision, CronJob geo-db-backup-prod, VAP, RBAC T1) with the PERMANENT SA
# geo-ci-bascule-prod (GH secret KUBE_CONFIG_DATA_PROD): first run dispatched by the k8s lane
# after merge (install-cd-bootstrap.sh step 4), then on every merge touching the bundle.
# NetworkPolicies are NOT part of it (netpol-geo-db-backup.k8s-apply.yaml, applied by k8s).
#   - NO GH-secret materialization of the app creds: geo-db-ro-prod + geo-pra-writer-prod are
#     materialized in-cluster by the sealed-secrets controller from the COMMITTED SealedSecrets.
#     This SA has 0 secrets:create by construction.
#   - NO CONFIRM gate: it runs on push to main when the bundle changes (idempotent). A bare
#     workflow_dispatch is kept for on-demand re-apply.
#   - OWNER GATE on the MANUAL paths only (job `approve`, Environment `geo-prod`, required
#     reviewer = owner): a workflow_dispatch, or ANY re-run attempt (github.run_attempt > 1,
#     including a re-run of a push run), pauses until the owner approves. Reason: an Actions
#     "write" token (e.g. the immo orchestrator's GEO_DISPATCH_TOKEN) can dispatch AND re-run
#     every workflow of this repo. The FIRST attempt of a push run stays automatic (0 click).
#     The approval is bound to the attempt (outputs.attempt == github.run_attempt): re-running
#     apply-bundle alone never reuses an older approval. To re-run after a failure, use
#     "Re-run all jobs" (a "Re-run failed jobs" skips apply-bundle by design).
#     Concurrency sits on apply-bundle (not on the workflow) so a run waiting for approval
#     never blocks the automatic push path.
#
# Apply order (VAP runbook — RBAC authZ precedes VAP admission):
#   0. Guard (geo addition): refuse while a SealedSecret file (committed by geo-cond:
#      geo-db-ro-prod-sealed.yaml, geo-pra-writer-prod-sealed.yaml) is absent, or a bundle file
#      still holds a REPLACE_WITH_ value.
#   1. Pre-flight — assert the PROD cluster (positive host + get deploy geo-api in ns geo).
#   2. Apply the 2 SealedSecrets; wait for Synced (tolerant).
#   3. Provision the strict RO Postgres role (Job geo-db-ro-role-provision), wait Complete.
#   4. Apply the DORMANT dump CronJob geo-db-backup-prod (suspend:true).
#   5. Apply the cluster-scoped VAP + Binding, then the T1 RBAC, then wait for propagation.
#   6. ANTI-RCE GATE (fail-closed): impersonate geo-ci-trigger-prod, --dry-run=server:
#      (A) jobTemplate mutation MUST be DENIED; (B) suspend flip MUST be ALLOWED. Otherwise the
#      T1 Role is NEUTRALIZED (rules emptied) and the run ABORTS.
#
# 0 Python. Runner does kubectl only (control-plane). NO dump bytes, NO S3 keys read back.
#
# SECOND JOB `apply-backup` — the DAILY PROD BACKUP (deploy/ci/backup/README.md), port of
# radar-immobilier#771: same permanent SA, same owner gate (`approve`, attempt-bound), same vault
# Environment geo-prod-bundle, same positive PROD pre-flight, its own arming switch
# BACKUP_DAILY_CD_ENABLED and its own failure domain (no `needs` on apply-bundle, own concurrency
# group: a backup apply problem never blocks the bascule bundle or its anti-RCE gate, and vice
# versa). It writes the core Secrets geo-backup-writer/-reader/-purger from the secrets and
# variables of the Environment geo-prod-bundle — NO SealedSecret, nothing committed: the three
# Secrets are pre-created by the k8s lane and replaced by name (get/update, no create), after a
# server-side dry-run of the 3 —,
# then applies the ConfigMap geo-backup-daily-script (rendered from
# deploy/ci/backup/backup-daily.cjs) and the CronJobs geo-backup-daily + geo-backup-freshness.
# Runner contract: kubectl only, 0 backup content read; the three S3 credentials transit the
# runner as masked env values and 0600 temp files, never argv, never logged.
name: bascule-bundle-cd (prod bundle apply, CD-native)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/ci/bascule-preprod/**'
      - 'deploy/ci/backup/**'
      - '.github/workflows/bascule-bundle-cd.yml'
  workflow_dispatch:
    inputs:
      backup_run_now:
        description: "apply-backup: also start one geo-backup-daily run now (create job --from=cronjob); apply-bundle is skipped"
        type: boolean
        default: false
      backup_include_archive:
        description: "with backup_run_now: that run also copies the frozen archive ops/decommission/20260913/ (one-time copy; repeat until the manifest shows 0 pending)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # OWNER GATE — manual paths only (dispatch, or re-run attempt > 1). Skipped on the first
  # attempt of a push run. Runs nothing before approval; no checkout, no token scope.
  approve:
    if: ${{ vars.BASCULE_BUNDLE_CD_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: geo-prod
    permissions: {}
    outputs:
      attempt: ${{ steps.bind.outputs.attempt }}
    steps:
      - name: Bind the owner approval to this run attempt
        id: bind
        run: |
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "owner-approved: event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA} attempt=${GITHUB_RUN_ATTEMPT} triggering_actor=${GITHUB_TRIGGERING_ACTOR}" | tee -a "$GITHUB_STEP_SUMMARY"

  apply-bundle:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SECRET VAULT `geo-prod-bundle` (0 reviewer, deployment branch = main ONLY): holds
    # KUBE_CONFIG_DATA_PROD → readable ONLY from main. The owner gate stays on `approve`
    # (Environment `geo-prod`); this Environment adds no approval, it only scopes the secret.
    environment: geo-prod-bundle
    # ARMING SWITCH: set to 'true' by install-cd-bootstrap.sh AFTER the one-time install (SA +
    # KUBE_CONFIG_DATA_PROD exist). Merging can never red a main push against a missing SA.
    # GATE: runs iff (a) `approve` succeeded IN THIS ATTEMPT, or (b) first attempt of a
    # non-dispatch (push) run, where `approve` is skipped. `!cancelled()` stops the default
    # success() check from cascading the skip of `approve` onto this job.
    #
    # SKIPPED on a `backup_run_now` dispatch (port of radar-immobilier#773): that dispatch exists
    # to start a backup, and re-applying the (idempotent) bundle at the same time runs its RO-role
    # Job next to the backup pod (both jobs observed together, run 36241832422; on immo this made
    # the RO-role Job unschedulable — Insufficient cpu → DeadlineExceeded, run 36225276353).
    # Skipping is the simplest safe choice: nothing in the bundle is needed by the backup
    # (geo-db-ro-prod already exists), and a plain dispatch or a push touching the bundle still
    # re-applies it. Sequencing with `needs` was rejected: it would still load the node right
    # before the backup and tie the backup to the bundle's anti-RCE gate.
    if: >-
      ${{ !cancelled() && vars.BASCULE_BUNDLE_CD_ENABLED == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.backup_run_now) &&
      ((needs.approve.result == 'success' && needs.approve.outputs.attempt == github.run_attempt) ||
      (needs.approve.result == 'skipped' && github.event_name != 'workflow_dispatch' && github.run_attempt == '1')) }}
    concurrency:
      group: bascule-bundle-cd
      cancel-in-progress: false
    env:
      NAMESPACE: geo
      BUNDLE: deploy/ci/bascule-preprod
    steps:
      - uses: actions/checkout@v4

      - name: Guard — bundle ready (SealedSecrets sealed, no placeholder)
        run: |
          set -euo pipefail
          for f in geo-db-ro-prod-sealed.yaml geo-pra-writer-prod-sealed.yaml; do
            if ! grep -Eq '^kind: SealedSecret' "$BUNDLE/$f" 2>/dev/null; then
              echo "::error title=Bundle not ready::$BUNDLE/$f absent or not a SealedSecret (sealed + committed by geo-cond). Nothing was applied."; exit 1
            fi
          done
          for f in geo-db-ro-prod-sealed.yaml geo-pra-writer-prod-sealed.yaml cronjob-db-backup-prod.yaml db-ro-role-provision.yaml vap-ci-trigger-suspend-only.yaml rbac-ci-trigger-prod.yaml; do
            if grep -Ev '^[[:space:]]*#' "$BUNDLE/$f" | grep -q 'REPLACE_WITH_'; then
              echo "::error title=Bundle not ready::$BUNDLE/$f still holds a REPLACE_WITH_ value (e.g. EXPECTED_DATABASE from k8s). Nothing was applied."; exit 1
            fi
          done

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (PROD — permanent geo-ci-bascule-prod SA)
        env:
          KUBE_CONFIG_DATA_PROD: ${{ secrets.KUBE_CONFIG_DATA_PROD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA_PROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PROD" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Pre-flight — assert PROD cluster
        env:
          EXPECTED_KUBE_APISERVER_HOST_PROD: ${{ vars.EXPECTED_KUBE_APISERVER_HOST_PROD || vars.EXPECTED_KUBE_APISERVER_HOST }}
        run: |
          set -euo pipefail
          DEFAULT_HOST='hlhedx.c1.bhs5.k8s.ovh.net'
          expected="${EXPECTED_KUBE_APISERVER_HOST_PROD:-$DEFAULT_HOST}"
          if [ -z "${EXPECTED_KUBE_APISERVER_HOST_PROD:-}" ]; then
            echo "::warning title=Pre-flight using built-in default::set EXPECTED_KUBE_APISERVER_HOST[_PROD] to make the guard explicit (falling back to ${DEFAULT_HOST})."
          fi
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          host="${server#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "kubeconfig apiserver host : ${host:-<none>}"
          echo "expected apiserver host   : ${expected}"
          if [ "$host" != "$expected" ]; then
            echo "::error title=Wrong cluster — apply-bundle refused::kubeconfig targets '${host:-<none>}' but expected '${expected}'. Nothing was applied."; exit 1
          fi
          kubectl -n "$NAMESPACE" get deploy geo-api -o name
          echo "pre-flight OK — ${expected} / namespace ${NAMESPACE}"

      - name: Apply SealedSecrets (geo-db-ro-prod + geo-pra-writer-prod)
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" apply -f "$BUNDLE/geo-db-ro-prod-sealed.yaml"
          kubectl -n "$NAMESPACE" apply -f "$BUNDLE/geo-pra-writer-prod-sealed.yaml"
          echo "SealedSecrets applied — controller will materialize geo-db-ro-prod + geo-pra-writer-prod."

      - name: Wait for SealedSecrets Synced (tolerant)
        run: |
          set -uo pipefail
          synced_deadline=$((SECONDS + 120))
          for ss in geo-db-ro-prod geo-pra-writer-prod; do
            while :; do
              s="$(kubectl -n "$NAMESPACE" get sealedsecret "$ss" -o 'jsonpath={.status.conditions[?(@.type=="Synced")].status}' 2>/dev/null || true)"
              if [ "$s" = "True" ]; then echo "SealedSecret ${ss}: Synced=True"; break; fi
              if [ "$SECONDS" -ge "$synced_deadline" ]; then
                echo "::warning title=SealedSecret sync unconfirmed::${ss} did not report Synced=True within the poll window (status='${s:-<empty>}'). Proceeding — the RO-role Job below is the fail-closed backstop."
                break
              fi
              sleep 5
            done
          done

      - name: Provision strict RO Postgres role (Job geo-db-ro-role-provision)
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete job geo-db-ro-role-provision --ignore-not-found
          kubectl -n "$NAMESPACE" apply -f "$BUNDLE/db-ro-role-provision.yaml"
          deadline=$((SECONDS + 300))
          while :; do
            c="$(kubectl -n "$NAMESPACE" get job geo-db-ro-role-provision -o 'jsonpath={.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
            f="$(kubectl -n "$NAMESPACE" get job geo-db-ro-role-provision -o 'jsonpath={.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            if [ "$c" = "True" ]; then echo "RO role provisioned (Job Complete)."; break; fi
            if [ "$f" = "True" ]; then
              echo "::error title=RO role provision FAILED::inspect job geo-db-ro-role-provision in-cluster (0 runner logs)."; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=RO role provision TIMEOUT::did not complete in 300s (check sealed-secrets materialized geo-db-ro-prod, and the postgis ingress netpol in ns geo)."; exit 1
            fi
            sleep 5
          done

      - name: Apply dormant dump CronJob (suspend:true)
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" apply -f "$BUNDLE/cronjob-db-backup-prod.yaml"
          sus="$(kubectl -n "$NAMESPACE" get cronjob geo-db-backup-prod -o jsonpath='{.spec.suspend}')"
          echo "geo-db-backup-prod applied — spec.suspend=${sus} (must be true: dormant until the bascule triggers it)."
          if [ "$sus" != "true" ]; then
            echo "::error title=Dump CronJob not dormant::spec.suspend != true after apply — refusing to proceed."; exit 1
          fi

      - name: Apply VAP suspend-only (cluster-scoped)
        run: kubectl apply -f "$BUNDLE/vap-ci-trigger-suspend-only.yaml"

      - name: Apply RBAC T1 (trigger SA/Role/RoleBinding)
        run: kubectl -n "$NAMESPACE" apply -f "$BUNDLE/rbac-ci-trigger-prod.yaml"

      - name: Wait for VAP propagation
        env:
          VAP_PROPAGATION_SEC: ${{ vars.BASCULE_VAP_PROPAGATION_SEC || '20' }}
        run: |
          echo "waiting ${VAP_PROPAGATION_SEC}s for VAP propagation (measured lag 4-8s on the immo side)"
          sleep "${VAP_PROPAGATION_SEC}"

      - name: Anti-RCE gate — impersonation --dry-run=server negative test
        run: |
          # GitHub lance `run:` en `bash -e` : le refus ATTENDU du test (A) (rc≠0 dans
          # `out_a="$(…)"`) tuait l'étape avant tout verdict. `set +e` rend la main au
          # script, qui décide lui-même (rc_a / rc_b + cause) et reste fail-closed.
          set +e
          set -uo pipefail
          SA="system:serviceaccount:${NAMESPACE}:geo-ci-trigger-prod"
          CJ="geo-db-backup-prod"
          echo "gate @ $(date -u +%FT%TZ) — impersonating ${SA} on cronjob/${CJ}"
          neutralize() {
            echo "::group::Neutralize RBAC T1 (empty Role rules — close the RCE window)"
            kubectl -n "$NAMESPACE" patch role geo-ci-trigger-prod --type=merge -p '{"rules":[]}' || true
            echo "::endgroup::"
          }
          out_a="$(kubectl --as="$SA" -n "$NAMESPACE" patch cronjob "$CJ" --type=merge --dry-run=server \
            -p '{"spec":{"jobTemplate":{"spec":{"template":{"spec":{"containers":[{"name":"upload","image":"evil"}]}}}}}}' 2>&1)"
          rc_a=$?
          echo "── (A) jobTemplate mutation — expect DENIED — rc=${rc_a}"
          echo "${out_a}"
          if [ "$rc_a" -eq 0 ]; then
            echo "::error title=Anti-RCE gate FAILED (A admitted)::a jobTemplate mutation was ADMITTED — the VAP does NOT enforce suspend-only. Aborting + neutralizing RBAC T1."
            neutralize; exit 1
          fi
          if ! printf '%s' "${out_a}" | grep -qi 'geo-ci-trigger-suspend-only\|jobTemplate'; then
            echo "::error title=Anti-RCE gate FAILED (A wrong cause)::mutation rejected but NOT by the suspend-only VAP (rc=${rc_a}). Aborting + neutralizing RBAC T1."
            neutralize; exit 1
          fi
          out_b="$(kubectl --as="$SA" -n "$NAMESPACE" patch cronjob "$CJ" --type=merge --dry-run=server \
            -p '{"spec":{"suspend":false}}' 2>&1)"
          rc_b=$?
          echo "── (B) suspend flip — expect ALLOWED — rc=${rc_b}"
          echo "${out_b}"
          if [ "$rc_b" -ne 0 ]; then
            echo "::error title=Anti-RCE gate FAILED (B denied)::the trigger SA cannot even flip suspend (rc=${rc_b}) — T1 is broken. Aborting + neutralizing RBAC T1."
            neutralize; exit 1
          fi
          echo "anti-RCE gate OK — (A) jobTemplate DENIED by geo-ci-trigger-suspend-only, (B) suspend flip ALLOWED."

      - name: Summary
        if: always()
        run: |
          {
            echo "### geo bascule prod bundle applied (CD-native)"
            echo ""
            echo "- Cred: KUBE_CONFIG_DATA_PROD (permanent SA geo-ci-bascule-prod, 0 secrets:create)"
            echo "- SealedSecrets: geo-db-ro-prod, geo-pra-writer-prod (controller-materialized in-cluster)"
            echo "- RO Postgres role: geo_db_ro_prod (Job Complete)"
            echo "- Dump CronJob: geo-db-backup-prod (dormant, suspend:true)"
            echo "- VAP: geo-ci-trigger-suspend-only (cluster-scoped)"
            echo "- RBAC T1: geo-ci-trigger-prod (SA/Role/RoleBinding)"
            echo "- Anti-RCE gate: jobTemplate DENIED + suspend ALLOWED"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Daily prod backup (deploy/ci/backup/) — independent job ──────────────────
  apply-backup:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same vault as apply-bundle, readable from main only: KUBE_CONFIG_DATA_PROD, plus the three
    # backup identities (secrets GEO_BACKUP_{WRITER,READER,PURGER}_{ACCESS,SECRET}_KEY) and the
    # variables BACKUP_S3_ENDPOINT / BACKUP_S3_REGION / BACKUP_BUCKET / BACKUP_SOURCE_BUCKET.
    environment: geo-prod-bundle
    # Two switches: the bundle CD is armed (the permanent SA exists) AND the k8s lane armed the
    # backup AFTER re-applying rbac-ci-bascule-prod.yaml (the new name-scoped verbs). Merging can
    # never red main against an old Role. Same owner gate as apply-bundle: runs iff `approve`
    # succeeded IN THIS ATTEMPT, or on the first attempt of a push run (approve skipped).
    if: >-
      ${{ !cancelled() && vars.BASCULE_BUNDLE_CD_ENABLED == 'true' && vars.BACKUP_DAILY_CD_ENABLED == 'true' &&
      ((needs.approve.result == 'success' && needs.approve.outputs.attempt == github.run_attempt) ||
      (needs.approve.result == 'skipped' && github.event_name != 'workflow_dispatch' && github.run_attempt == '1')) }}
    concurrency:
      group: geo-backup-daily-cd
      cancel-in-progress: false
    env:
      NAMESPACE: geo
      BACKUP_DIR: deploy/ci/backup
    steps:
      - uses: actions/checkout@v4

      # The retention/manifest/upload/copy logic and the wiring must pass the selftest
      # (in-memory S3 fake, 0 network) before anything is applied.
      - name: Selftest backup logic (0 network)
        run: node "$BACKUP_DIR/backup-daily.selftest.mjs"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig (PROD — permanent geo-ci-bascule-prod SA)
        env:
          KUBE_CONFIG_DATA_PROD: ${{ secrets.KUBE_CONFIG_DATA_PROD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBE_CONFIG_DATA_PROD" | base64 -d 2>/dev/null | grep -q '^apiVersion:'; then
            printf '%s' "$KUBE_CONFIG_DATA_PROD" | base64 -d > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG_DATA_PROD" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Pre-flight — assert PROD cluster
        env:
          EXPECTED_KUBE_APISERVER_HOST_PROD: ${{ vars.EXPECTED_KUBE_APISERVER_HOST_PROD || vars.EXPECTED_KUBE_APISERVER_HOST }}
        run: |
          set -euo pipefail
          DEFAULT_HOST='hlhedx.c1.bhs5.k8s.ovh.net'
          expected="${EXPECTED_KUBE_APISERVER_HOST_PROD:-$DEFAULT_HOST}"
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          host="${server#*://}"; host="${host%%/*}"; host="${host%%:*}"
          echo "kubeconfig apiserver host : ${host:-<none>}"
          echo "expected apiserver host   : ${expected}"
          if [ "$host" != "$expected" ]; then
            echo "::error title=Wrong cluster — apply-backup refused::kubeconfig targets '${host:-<none>}' but expected '${expected}'. Nothing was applied."; exit 1
          fi
          kubectl -n "$NAMESPACE" get deploy geo-api -o name
          echo "pre-flight OK — ${expected} / namespace ${NAMESPACE}"

      # ── Backup identities: Environment geo-prod-bundle → core Secrets (NO SealedSecret) ──
      # Source of truth = the secrets/variables of the Environment geo-prod-bundle + the `.env`
      # recovery copy of the k8s lane (deploy/ci/bascule-preprod/CRED_CYCLE.md). Nothing about
      # these credentials is committed, sealed or not.
      # The three Secrets are PRE-CREATED by the k8s lane: this SA holds get/update
      # on exactly these three names and NO create/patch/list/watch/delete — a
      # missing Secret is a hard error here, never a create.
      # Method: `kubectl replace` (GET + PUT = get + update) of objects rendered
      # client-side (`kubectl create secret generic --dry-run=client`, each value read
      # from a file in a 0700 temp dir: never in argv, never echoed). The PUT makes
      # the live data EXACTLY the key set below (a stale extra key is dropped),
      # writes no last-applied annotation (a client-side `kubectl apply` would copy
      # the credentials into it) and clears any former ownerReference.
      # No partial write: a server-side dry-run of the 3 PUTs (RBAC, admission,
      # immutable fields, key set) must pass for all 3 before the first real PUT.
      # Values reach the script through `env:` only (never a `${{ }}` inside `run:`);
      # GitHub masks the secrets; no `set -x`; logs carry names and key names only.
      # Fail-closed: every check (10 GitHub values present, single-line, keys of the
      # expected charset/length, S3 endpoint/region = the pinned BHS target (egress netpol: 54.39.60.208 only), bucket
      # variables = the CronJob guards, the 3 Secrets exist) runs before any write.
      - name: Write backup Secrets from GitHub (geo-backup-writer + geo-backup-reader + geo-backup-purger)
        env:
          GEO_BACKUP_WRITER_ACCESS_KEY: ${{ secrets.GEO_BACKUP_WRITER_ACCESS_KEY }}
          GEO_BACKUP_WRITER_SECRET_KEY: ${{ secrets.GEO_BACKUP_WRITER_SECRET_KEY }}
          GEO_BACKUP_READER_ACCESS_KEY: ${{ secrets.GEO_BACKUP_READER_ACCESS_KEY }}
          GEO_BACKUP_READER_SECRET_KEY: ${{ secrets.GEO_BACKUP_READER_SECRET_KEY }}
          GEO_BACKUP_PURGER_ACCESS_KEY: ${{ secrets.GEO_BACKUP_PURGER_ACCESS_KEY }}
          GEO_BACKUP_PURGER_SECRET_KEY: ${{ secrets.GEO_BACKUP_PURGER_SECRET_KEY }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_SOURCE_BUCKET: ${{ vars.BACKUP_SOURCE_BUCKET }}
        run: |
          set -euo pipefail
          umask 077
          # Keys of each Secret = exactly what the CronJobs mount (checked by the selftest).
          declare -A KEYS=(
            [writer]="S3_ENDPOINT S3_REGION S3_ACCESS_KEY S3_SECRET_KEY BACKUP_BUCKET SOURCE_BUCKET"
            [reader]="S3_ENDPOINT S3_REGION S3_ACCESS_KEY S3_SECRET_KEY BACKUP_BUCKET"
            [purger]="S3_ENDPOINT S3_REGION S3_ACCESS_KEY S3_SECRET_KEY BACKUP_BUCKET"
          )
          # Shared (non-secret) values: GitHub variable feeding each key.
          declare -A FROM_VAR=([S3_ENDPOINT]=BACKUP_S3_ENDPOINT [S3_REGION]=BACKUP_S3_REGION [BACKUP_BUCKET]=BACKUP_BUCKET [SOURCE_BUCKET]=BACKUP_SOURCE_BUCKET)
          # Pinned S3 target (OVH BHS; the egress netpol allows 54.39.60.208/32:443 only) and credential shape.
          PINNED_S3_ENDPOINT="https://s3.bhs.io.cloud.ovh.net"
          PINNED_S3_REGION="bhs"
          RE_ACCESS_KEY='^[A-Za-z0-9]{16,128}$'
          RE_SECRET_KEY='^[A-Za-z0-9/+=]{16,128}$'

          # 1. GitHub values present, single-line, well-formed (names only in the log).
          bad=""
          for v in GEO_BACKUP_WRITER_ACCESS_KEY GEO_BACKUP_WRITER_SECRET_KEY \
                   GEO_BACKUP_READER_ACCESS_KEY GEO_BACKUP_READER_SECRET_KEY \
                   GEO_BACKUP_PURGER_ACCESS_KEY GEO_BACKUP_PURGER_SECRET_KEY \
                   BACKUP_S3_ENDPOINT BACKUP_S3_REGION BACKUP_BUCKET BACKUP_SOURCE_BUCKET; do
            if [ -z "${!v:-}" ]; then bad="${bad} ${v}(missing)"; continue; fi
            case "${!v}" in *$'\n'*|*$'\r'*) bad="${bad} ${v}(multi-line)"; continue ;; esac
            case "$v" in
              *_ACCESS_KEY) [[ "${!v}" =~ $RE_ACCESS_KEY ]] || bad="${bad} ${v}(format ${RE_ACCESS_KEY})" ;;
              *_SECRET_KEY) [[ "${!v}" =~ $RE_SECRET_KEY ]] || bad="${bad} ${v}(format ${RE_SECRET_KEY})" ;;
              BACKUP_S3_ENDPOINT) [ "${!v}" = "$PINNED_S3_ENDPOINT" ] || bad="${bad} ${v}(must be ${PINNED_S3_ENDPOINT})" ;;
              BACKUP_S3_REGION) [ "${!v}" = "$PINNED_S3_REGION" ] || bad="${bad} ${v}(must be ${PINNED_S3_REGION})" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error title=Backup credentials missing or invalid in GitHub::Environment geo-prod-bundle:${bad}. Nothing was applied."; exit 1
          fi

          # 2. Bucket variables = the positive guards of the committed CronJob.
          cj="$BACKUP_DIR/cronjob-backup-daily.yaml"
          exp_backup="$(sed -n 's/.*name: EXPECTED_BACKUP_BUCKET, value: "\([^"]*\)".*/\1/p' "$cj" | sort -u)"
          exp_source="$(sed -n 's/.*name: EXPECTED_SOURCE_BUCKET, value: "\([^"]*\)".*/\1/p' "$cj" | sort -u)"
          if [ -z "$exp_backup" ] || [ -z "$exp_source" ] || [ "$BACKUP_BUCKET" != "$exp_backup" ] || [ "$BACKUP_SOURCE_BUCKET" != "$exp_source" ]; then
            echo "::error title=Backup bucket variables mismatch::BACKUP_BUCKET='${BACKUP_BUCKET}' / BACKUP_SOURCE_BUCKET='${BACKUP_SOURCE_BUCKET}' must equal the CronJob guards '${exp_backup}' / '${exp_source}'. Nothing was applied."; exit 1
          fi

          # 3. The three Secrets exist (pre-created by the k8s lane; this SA cannot create).
          for id in writer reader purger; do
            if ! kubectl -n "$NAMESPACE" get secret "geo-backup-${id}" -o name >/dev/null; then
              echo "::error title=Backup Secret not pre-created::secret/geo-backup-${id} is absent or not readable by geo-ci-bascule-prod (k8s lane: pre-create the three Secrets, re-apply rbac-ci-bascule-prod.yaml). Nothing was applied."; exit 1
            fi
          done

          # 4. Render the 3 Secrets client-side (values from 0600 files; the rendered
          #    manifests stay in the 0700 temp dir, removed on exit).
          tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/geo-backup-secrets.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          for id in writer reader purger; do
            ID="${id^^}"
            read -ra keys <<< "${KEYS[$id]}"
            mkdir "$tmp/$id"
            args=()
            for k in "${keys[@]}"; do
              case "$k" in
                S3_ACCESS_KEY) src="GEO_BACKUP_${ID}_ACCESS_KEY" ;;
                S3_SECRET_KEY) src="GEO_BACKUP_${ID}_SECRET_KEY" ;;
                *) src="${FROM_VAR[$k]}" ;;
              esac
              printf '%s' "${!src}" > "$tmp/$id/$k"
              args+=("--from-file=${k}=${tmp}/${id}/${k}")
            done
            kubectl -n "$NAMESPACE" create secret generic "geo-backup-${id}" --type=Opaque "${args[@]}" --dry-run=client -o yaml \
              | kubectl label --local -f - app.kubernetes.io/name=geo-backup-daily app.kubernetes.io/part-of=geo app.kubernetes.io/component=db-backup -o yaml \
              > "$tmp/${id}.yaml"
            rm -rf "${tmp:?}/${id}"
          done
          # Key names of the object the server returns (never a value).
          keys_json() { node -e 'let s="";process.stdin.on("data",(c)=>{s+=c;}).on("end",()=>{let k="<unreadable>";try{k=Object.keys(JSON.parse(s).data||{}).sort().join(" ");}catch{}process.stdout.write(k);});'; }
          want_of() { local -a ks; read -ra ks <<< "${KEYS[$1]}"; printf '%s\n' "${ks[@]}" | sort | paste -sd' ' -; }

          # 5a. Server-side dry-run of the 3 PUTs: nothing is written unless all 3 pass.
          for id in writer reader purger; do
            if ! live="$(kubectl -n "$NAMESPACE" replace --dry-run=server -f "$tmp/${id}.yaml" -o json | keys_json)" || [ "$live" != "$(want_of "$id")" ]; then
              echo "::error title=geo-backup-${id} refused by the server-side dry-run::keys '${live:-}' (expected '$(want_of "$id")'). Nothing was written."; exit 1
            fi
          done
          echo "server-side dry-run OK for the 3 Secrets"

          # 5b. Real PUTs, same manifests; check the key set the server returns.
          for id in writer reader purger; do
            if ! live="$(kubectl -n "$NAMESPACE" replace -f "$tmp/${id}.yaml" -o json | keys_json)" || [ "$live" != "$(want_of "$id")" ]; then
              echo "::error title=geo-backup-${id} not written as expected::keys '${live:-}' (expected '$(want_of "$id")')."; exit 1
            fi
            echo "secret/geo-backup-${id} replaced from GitHub — keys: ${live}"
          done

      # The script ships as a ConfigMap rendered from the committed file (single source of
      # truth, the same bytes the selftest exercised), then the two CronJobs.
      - name: Apply script ConfigMap + CronJobs geo-backup-daily + geo-backup-freshness
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" create configmap geo-backup-daily-script \
            --from-file=backup-daily.cjs="$BACKUP_DIR/backup-daily.cjs" --dry-run=client -o yaml \
            | kubectl label --local -f - app.kubernetes.io/name=geo-backup-daily app.kubernetes.io/part-of=geo \
                app.kubernetes.io/component=db-backup -o yaml \
            | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" apply -f "$BACKUP_DIR/cronjob-backup-daily.yaml"
          got="$(kubectl -n "$NAMESPACE" get cronjob geo-backup-daily -o jsonpath='{.spec.schedule}|{.spec.suspend}|{.spec.concurrencyPolicy}')"
          echo "geo-backup-daily schedule|suspend|concurrencyPolicy = ${got}"
          if [ "$got" != "23 3 * * *|false|Forbid" ]; then
            echo "::error title=geo-backup-daily not as committed::live spec '${got}' differs from the committed manifest."; exit 1
          fi
          kubectl -n "$NAMESPACE" apply -f "$BACKUP_DIR/cronjob-backup-freshness.yaml"
          got="$(kubectl -n "$NAMESPACE" get cronjob geo-backup-freshness -o jsonpath='{.spec.schedule}|{.spec.suspend}|{.spec.concurrencyPolicy}')"
          echo "geo-backup-freshness schedule|suspend|concurrencyPolicy = ${got}"
          if [ "$got" != "47 7 * * *|false|Forbid" ]; then
            echo "::error title=geo-backup-freshness not as committed::live spec '${got}' differs from the committed manifest."; exit 1
          fi
          echo "script sha256 = $(sha256sum "$BACKUP_DIR/backup-daily.cjs" | cut -d' ' -f1) (recorded by each run as manifest.tool.scriptSha256)"

      # backup_include_archive: the one-time copy of the frozen archive (README.md) is the same Job
      # with the archive prefix removed from DOCS_EXCLUDE_PREFIXES (client-side edit of the Job
      # rendered from the live CronJob; the CronJob itself is never changed).
      # Refused inside the scheduled window (03:13–06:30 UTC: the 03:23 run, its 1 h starting
      # deadline and 3 h deadline) and while another run is active.
      - name: Start one run now (workflow_dispatch input backup_run_now)
        if: github.event_name == 'workflow_dispatch' && inputs.backup_run_now
        env:
          INCLUDE_ARCHIVE: ${{ inputs.backup_include_archive }}
          ARCHIVE_PREFIX: ops/decommission/20260913/
          WINDOW_START_MIN: "193"
          WINDOW_END_MIN: "390"
        run: |
          set -euo pipefail
          now_min=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          if [ "$now_min" -ge "$WINDOW_START_MIN" ] && [ "$now_min" -lt "$WINDOW_END_MIN" ]; then
            echo "::error title=Inside the scheduled backup window::$(date -u +%H:%M) UTC is within 03:13–06:30 UTC (scheduled geo-backup-daily run). Dispatch again outside it."; exit 1
          fi
          active="$(kubectl -n "$NAMESPACE" get jobs -l app.kubernetes.io/name=geo-backup-daily -o jsonpath='{range .items[?(@.status.active)]}{.metadata.name}{" "}{end}')"
          if [ -n "$active" ]; then
            echo "::error title=Backup run already active::${active}— not starting a second one (same bucket, same day)."; exit 1
          fi
          job="geo-backup-manual-$(date -u +%Y%m%d%H%M%S)"
          if [ "$INCLUDE_ARCHIVE" = "true" ]; then
            cur="$(sed -n 's/.*name: DOCS_EXCLUDE_PREFIXES, value: "\([^"]*\)".*/\1/p' "$BACKUP_DIR/cronjob-backup-daily.yaml")"
            new="$(printf '%s\n' "$cur" | tr ',' '\n' | grep -vxF "$ARCHIVE_PREFIX" | paste -sd, - || true)"
            if [ "$new" = "$cur" ]; then
              echo "::error title=Archive prefix not found::DOCS_EXCLUDE_PREFIXES='${cur}' does not hold ${ARCHIVE_PREFIX}."; exit 1
            fi
            kubectl -n "$NAMESPACE" create job "$job" --from=cronjob/geo-backup-daily --dry-run=client -o yaml \
              | kubectl set env --local -f - -c backup "DOCS_EXCLUDE_PREFIXES=${new}" -o yaml \
              | kubectl -n "$NAMESPACE" create -f -
            echo "started job/${job} WITH the archive (DOCS_EXCLUDE_PREFIXES='${new}')."
          else
            kubectl -n "$NAMESPACE" create job "$job" --from=cronjob/geo-backup-daily
            echo "started job/${job}."
          fi
          echo "verdict in-cluster (Job .status + manifests/latest.json); the runner reads no backup content."

      - name: Summary
        if: always()
        run: |
          {
            echo "### geo daily prod backup applied"
            echo ""
            echo "- Secrets (from Environment geo-prod-bundle, no SealedSecret): geo-backup-writer (copy, no delete), geo-backup-purger (DeleteObject only), geo-backup-reader (restore + freshness)"
            echo "- ConfigMap: geo-backup-daily-script (from deploy/ci/backup/backup-daily.cjs)"
            echo "- CronJob: geo-backup-daily (23 3 * * * UTC, Forbid) → s3://geo-backup"
            echo "- CronJob: geo-backup-freshness (47 7 * * * UTC) — fails when latest.json is stale or not complete for > 3 days"
          } >> "$GITHUB_STEP_SUMMARY"
