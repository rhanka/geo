# CI job-launcher RBAC for the geo autonomous CI/CD (GitHub Actions launches geo preprod jobs,
# replacing operator `kubectl apply`). Owner directive: geo autonomous on its ops, CI/CD launches jobs.
#
# ns geo-preprod ONLY — aligned to deploy/constraints/cptaq-serve-job.yaml `metadata.namespace`
# (geo-preprod, NOT geo). The SA can act ONLY in geo-preprod → PROD OUT OF REACH BY CONSTRUCTION.
# Least-priv (k8s-archi): launch/watch/delete Jobs + read pods/logs + write configmaps (render output).
# NO `secrets` read: the Jobs reference the existing geo-s3-credentials secret via envFrom/secretRef;
# the CI runner NEVER reads secret values.
#
# Provisioning of the SA token → kubeconfig secret KUBE_CONFIG_GEO = owner/infra (NOT this repo).
# This manifest only declares the in-cluster RBAC; the workflow consumes the secret. Apply it once
# (owner/infra, or a bootstrap) — the SA + Role + binding are the durable least-priv surface.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: geo-ci-runner
  namespace: geo-preprod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geo-ci-job-launcher
  namespace: geo-preprod
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "patch"]
  # NO `secrets`: Jobs reference geo-s3-credentials via envFrom/secretRef; the CI never reads secrets.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geo-ci-runner-job-launcher
  namespace: geo-preprod
subjects:
  - kind: ServiceAccount
    name: geo-ci-runner
    namespace: geo-preprod
roleRef:
  kind: Role
  name: geo-ci-job-launcher
  apiGroup: rbac.authorization.k8s.io
---
# §5 basemap ACTIVATION RBAC (activate-serve workflow, GO#2). SEPARATE Role from the job-launcher —
# scoped to the SINGLE secret geo-tile-key (write the minted 2D key) + the geo-api deployment (rollout
# restart to pick up the key). k8s RBAC cannot scope `create` by resourceName, so the secret is
# PRE-CREATED empty at owner bootstrap (50-owner-bootstrap-all.sh) → this Role needs only get/update on
# that ONE name (NEVER create/list/all-secrets). Usable ONLY via the owner-approved geo-preprod-Environment
# dispatch (KUBE_CONFIG_GEO is env-scoped behind required-reviewer=owner). Co-val i-infra [c9beeb]
# (resourceNames scope [geo-tile-key]+[geo-api], never all-secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: geo-ci-basemap-activation
  namespace: geo-preprod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"] # `kubectl apply` on the PRE-CREATED geo-tile-key does get + 3-way-merge PATCH
    resourceNames: ["geo-tile-key"] # the SINGLE key secret — never all-secrets, never create/list
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["geo-api"] # rollout restart to pick up the key — never other deployments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: geo-ci-runner-basemap-activation
  namespace: geo-preprod
subjects:
  - kind: ServiceAccount
    name: geo-ci-runner
    namespace: geo-preprod
roleRef:
  kind: Role
  name: geo-ci-basemap-activation
  apiGroup: rbac.authorization.k8s.io
