# =============================================================================
# geo-backup-freshness — daily FRESHNESS CHECK of the geo prod backup, ns geo.
#
# Reads s3://geo-backup/manifests/latest.json ONLY (identity geo-backup-reader,
# read-only) and FAILS (exit 5 → Job Failed) when:
#   - the latest backup is older than FRESHNESS_MAX_AGE_DAYS (1: date < D-1), or
#   - backups have not been `complete` for more than FRESHNESS_MAX_PARTIAL_DAYS
#     (3) days (latest.json `partialSince`; `latestComplete` = newest complete).
# A `partial` backup (seed, objects pending) exits 0 in geo-backup-daily: this
# check is what turns a lasting partial state into a visible failure.
#
# Same image (geo-api digest of geo-db-backup-prod) and same script ConfigMap
# (geo-backup-daily-script, mode `freshness`) as geo-backup-daily. Applied by
# .github/workflows/bascule-bundle-cd.yml job `apply-backup`.
#
# NETWORK: no role=pra-backup label (no postgis access needed). The geo namespace
# default-deny is INGRESS only; no egress policy selects this pod, so it reaches
# S3. If an egress default-deny is ever added to ns geo, this pod needs S3 egress.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geo-backup-freshness
  namespace: geo
  labels:
    app.kubernetes.io/name: geo-backup-freshness
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/component: backup-check
spec:
  # 07:47 UTC: after the backup window (03:23 start, 1 h starting deadline, 3 h deadline).
  schedule: "47 7 * * *"
  timeZone: "Etc/UTC"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: geo-backup-freshness
        app.kubernetes.io/part-of: geo
        app.kubernetes.io/component: backup-check
    spec:
      # A stale backup is a verdict, not a transient error: no retry.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: geo-backup-freshness
            app.kubernetes.io/part-of: geo
            app.kubernetes.io/component: backup-check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - { name: scratch, emptyDir: { sizeLimit: 64Mi } }
            - name: script
              configMap:
                name: geo-backup-daily-script
                defaultMode: 0444
          containers:
            - name: freshness
              image: "ghcr.io/rhanka/geo-api@sha256:c2f03fd55ffed513f0112b3877cafde4fb383f758e8d5171feb2a2fcbef69373"
              command: ["node", "/opt/backup/backup-daily.cjs", "freshness"]
              env:
                - { name: NODE_PATH, value: "/app/node_modules" }
                - { name: NODE_OPTIONS, value: "--max-old-space-size=96 --dns-result-order=ipv4first" }
                - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
                # Identity geo-backup-reader (SealedSecret, k8s lane): read-only on geo-backup.
                - { name: S3_ENDPOINT,   valueFrom: { secretKeyRef: { name: geo-backup-reader, key: S3_ENDPOINT } } }
                - { name: S3_REGION,     valueFrom: { secretKeyRef: { name: geo-backup-reader, key: S3_REGION } } }
                - { name: S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: geo-backup-reader, key: S3_ACCESS_KEY } } }
                - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: geo-backup-reader, key: S3_SECRET_KEY } } }
                - { name: BACKUP_BUCKET, valueFrom: { secretKeyRef: { name: geo-backup-reader, key: BACKUP_BUCKET } } }
                - { name: S3_FORCE_PATH_STYLE, value: "false" }
                - { name: EXPECTED_BACKUP_BUCKET, value: "geo-backup" }
                - { name: FRESHNESS_MAX_AGE_DAYS, value: "1" }
                - { name: FRESHNESS_MAX_PARTIAL_DAYS, value: "3" }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 200m, memory: 192Mi }
              volumeMounts:
                - { name: scratch, mountPath: /tmp }
                - { name: script, mountPath: /opt/backup, readOnly: true }
