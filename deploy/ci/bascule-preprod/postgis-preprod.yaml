# =============================================================================
# postgis-preprod.yaml — base PostgreSQL/PostGIS de la PRÉPROD geo (ns geo-preprod),
# cible de la restauration PG (S2) de la bascule MODE=restore.
#
# Miroir de deploy/k8s/postgis-statefulset.yaml (prod, ns geo) avec les valeurs
# préprod confirmées par la lane k8s : 1 réplica, requests 10m / 128Mi (le nœud est
# à ~95 % en requests CPU : ne pas dépasser 10m), limits 250m / 512Mi, PVC `pg-data`
# 2Gi `block-standard`. Superuser = Secret `geo-postgis-credentials` (POSTGRES_DB,
# POSTGRES_USER, POSTGRES_PASSWORD), PRÉ-CRÉÉ vide par k8s et RÉÉCRIT par la bascule
# depuis l'environment GitHub geo-bascule (restore-mode.mjs backup-secret-fill,
# kubectl replace --dry-run=server puis replace ; jamais de SealedSecret).
#
# ⚠ L'image postgres n'applique POSTGRES_PASSWORD qu'à l'INITIALISATION d'un volume
# vide : avec le PVC persistant, une rotation passe par `ALTER ROLE … PASSWORD …`
# (socket local dans le pod) AVANT le replace du Secret — ou par la recréation du PVC
# (base jetable). Voir CRED_CYCLE.md. Un mot de passe désaligné est détecté par
# l'étape pg-check (pg_isready + SELECT 1) AVANT toute action destructive.
#
# Appliqué par la bascule (restore-mode.mjs pg-apply : kubectl apply + rollout status),
# SA geo-ci-bascule-preprod (rbac-ci-bascule-preprod.yaml). Réseau : ingress 5432
# UNIQUEMENT depuis les pods `role=pra-restore` (Jobs de la bascule), rien depuis
# geo-api ; aucune sortie pour postgis ; les pods pra-restore sortent vers le DNS,
# S3-BHS:443 et geo-postgis:5432 seulement.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: geo-preprod
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
spec:
  replicas: 1
  serviceName: geo-postgis
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      partition: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
        app.kubernetes.io/part-of: geo
        app.kubernetes.io/instance: preprod
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: geo-postgis-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: geo-postgis-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geo-postgis-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg-data
        labels:
          app.kubernetes.io/name: postgis
          app.kubernetes.io/part-of: geo
          app.kubernetes.io/instance: preprod
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: block-standard
        volumeMode: Filesystem
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: geo-postgis
  namespace: geo-preprod
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgis
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: postgresql
---
# postgis préprod : entrée 5432 UNIQUEMENT depuis les pods `role=pra-restore` du même
# namespace (Jobs de la bascule). Rien depuis geo-api ni d'ailleurs. Aucune sortie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geo-postgis-preprod
  namespace: geo-preprod
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: pra-restore
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
# Pods `role=pra-restore` (pg-check, snapshot G1, restauration S2, rollback) : DNS de
# kube-system, S3-BHS:443 (lecture du dump de geo-backup) et geo-postgis:5432 du même
# namespace. Rien d'autre (jamais la prod : le Service geo-postgis de la prod vit dans
# le ns geo, hors de portée).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pra-restore-egress
  namespace: geo-preprod
  labels:
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
    role: pra-restore
spec:
  podSelector:
    matchLabels:
      role: pra-restore
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 54.39.60.208/32 # S3 BHS (s3.bhs.io.cloud.ovh.net)
      ports:
        - protocol: TCP
          port: 443
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis
      ports:
        - protocol: TCP
          port: 5432
