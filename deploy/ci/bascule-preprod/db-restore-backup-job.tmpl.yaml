# =============================================================================
# db-restore-backup-job.tmpl.yaml — S2 de la bascule geo MODE=restore : restaurer la
# base du postgis PRÉPROD DEPUIS le backup quotidien geo-backup/pg/<D>/<db>.dump
# (format -Fc). Port de rhanka/radar-immobilier#777.
#
#   initContainer `fetch`   (image geo-api, backup-restore.cjs BR_STEP=fetch-dump,
#                           lecteur ${READER_SECRET}) : relit manifests/<D>.json (sha256
#                           = PIN de resolve), télécharge le dump en calculant son
#                           sha256 et REFUSE sauf égalité manifeste = sidecar = PIN ;
#                           écrit /work/<db>.dump + /work/backup.env.
#   container     `restore` (postgis) : G2 (aucune autre session sur la base),
#                           base du Secret == EXPECTED_DATABASE, pg_restore --list
#                           (nombre d'entrées TOC == manifeste, dbname de l'archive ==
#                           EXPECTED_DATABASE), cible munie des extensions de
#                           l'image postgis, liste -L = TOC moins les entrées
#                           EXTENSION/COMMENT et SCHEMA/COMMENT des extensions de
#                           l'image (fuzzystrmatch, postgis, postgis_tiger_geocoder,
#                           postgis_topology ; schémas tiger, tiger_data, topology),
#                           puis pg_restore --clean --if-exists --no-owner
#                           --no-privileges --exit-on-error --single-transaction
#                           --use-list (tout ou rien), puis contrôle post-restauration
#                           (postgis répond, nombre de tables = TOC).
#                           Incident 2026-09-26 et reproduction : README, section
#                           « Restauration PostgreSQL » ; test Docker :
#                           restore-pg.docker.selftest.mjs.
#
# Avant ce Job (restore-pg.mjs) : pg-check (pg_isready + SELECT 1) et G1 (snapshot).
# Pod `role=pra-restore` (netpol pra-restore-egress : DNS, S3-BHS:443,
# geo-postgis:5432). Superuser préprod = PG* libpq depuis ${PG_SECRET}.
# Runner = kubectl seul (.status + messages de fin de `fetch` et `restore`).
#
# Placeholders : ${JOB_NAME} ${NAMESPACE} ${IMAGE} ${PG_IMAGE} ${READER_SECRET}
# ${S3_ENDPOINT} ${PINNED_S3_ENDPOINT} ${S3_REGION} ${S3_FORCE_PATH_STYLE}
# ${EXPECTED_BACKUP_BUCKET} ${EXPECTED_DATABASE} ${BACKUP_DATE} ${PIN_MANIFEST_SHA256}
# ${PIN_PG_SHA256} ${PG_SERVICE} ${PG_SECRET} ${TTL_SECONDS}, plus le placeholder
# BR_SCRIPT sous les args de `fetch` (jamais écrit dans un commentaire : il s'étend
# sur de nombreuses lignes). $VAR du shell = variables d'EXÉCUTION.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
  labels:
    role: pra-restore
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/component: pra-restore
    sentropic.io/bascule: pg-restore
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: ${TTL_SECONDS}
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        role: pra-restore
        app.kubernetes.io/part-of: geo
        app.kubernetes.io/component: pra-restore
        sentropic.io/bascule: pg-restore
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      initContainers:
        - name: fetch
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "-e"]
          args:
            - |
${BR_SCRIPT}
          env:
            - { name: BR_STEP, value: "fetch-dump" }
            - { name: AWS_EC2_METADATA_DISABLED, value: "true" }
            - { name: WORK_DIR, value: "/work" }
            - { name: S3_ENDPOINT, value: "${S3_ENDPOINT}" }
            - { name: PINNED_S3_ENDPOINT, value: "${PINNED_S3_ENDPOINT}" }
            - { name: S3_REGION, value: "${S3_REGION}" }
            - { name: S3_FORCE_PATH_STYLE, value: "${S3_FORCE_PATH_STYLE}" }
            - { name: EXPECTED_BACKUP_BUCKET, value: "${EXPECTED_BACKUP_BUCKET}" }
            - { name: EXPECTED_DATABASE, value: "${EXPECTED_DATABASE}" }
            - { name: BACKUP_DATE, value: "${BACKUP_DATE}" }
            - { name: PIN_MANIFEST_SHA256, value: "${PIN_MANIFEST_SHA256}" }
            - { name: PIN_PG_SHA256, value: "${PIN_PG_SHA256}" }
            - { name: READER_ACCESS_KEY, valueFrom: { secretKeyRef: { name: ${READER_SECRET}, key: S3_ACCESS_KEY } } }
            - { name: READER_SECRET_KEY, valueFrom: { secretKeyRef: { name: ${READER_SECRET}, key: S3_SECRET_KEY } } }
            - { name: BACKUP_BUCKET, valueFrom: { secretKeyRef: { name: ${READER_SECRET}, key: BACKUP_BUCKET } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: { cpu: 10m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: restore
          image: ${PG_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -uo pipefail
              T=/dev/termination-log
              fin() { printf '{"ok":%s,"step":"pg-restore","date":"%s","tocEntries":%s,"reason":"%s"}' "$1" "$BACKUP_DATE" "$2" "$3" > "$T" 2>/dev/null || true; }
              BACKUP_DATE=unknown
              # shellcheck disable=SC1091
              . /work/backup.env || { fin false null "backup.env absent (fetch)"; exit 1; }
              if [ "$PGDATABASE" != "$EXPECTED_DATABASE" ]; then
                fin false null "POSTGRES_DB of the Secret differs from EXPECTED_DATABASE, restore refused"; exit 2
              fi
              busy="$(psql -X -v ON_ERROR_STOP=1 -d postgres -tAc "select count(*) from pg_stat_activity where datname = '$EXPECTED_DATABASE' and backend_type = 'client backend' and pid <> pg_backend_pid()")" || { fin false null "postgres unreachable"; exit 1; }
              if [ "$busy" != "0" ]; then
                fin false null "G2: $busy active session(s) on the target database, restore refused"; exit 2
              fi
              echo "[restore] backup date=$BACKUP_DATE sha256=$PG_SHA256 (verifie par fetch)"
              pg_restore --list "/work/$DUMP_FILE" > /tmp/toc.txt || { fin false null "archive unreadable (pg_restore --list)"; exit 1; }
              toc="$(grep -c '^[0-9]' /tmp/toc.txt || true)"
              if [ -n "$EXPECTED_TOC_ENTRIES" ] && [ "$toc" != "$EXPECTED_TOC_ENTRIES" ]; then
                fin false "$toc" "TOC entries differ from the manifest, restore refused"; exit 2
              fi
              src_db="$(awk -F': ' '/^;[[:space:]]+dbname:/ {print $2; exit}' /tmp/toc.txt | tr -cd 'a-z0-9_')"
              echo "[restore] toc_entries=$toc archive dbname='$src_db' attendu='$EXPECTED_DATABASE'"
              if [ -z "$src_db" ] || [ "$src_db" != "$EXPECTED_DATABASE" ]; then
                fin false "$toc" "archive dbname differs from EXPECTED_DATABASE, restore refused"; exit 2
              fi
              # Extensions fournies par l'image postgis (docker-entrypoint-initdb.d/10_postgis.sh)
              # et schemas qu'elles possedent : la cible les a deja, on ne les recree pas
              # (incident 2026-09-26 : CREATE EXTENSION postgis_tiger_geocoder rejoue depuis
              # le dump echoue, soundex introuvable, car fuzzystrmatch est dans le schema geo
              # en prod). Seules ces entrees TOC sont commentees dans la liste -L ; les
              # donnees (TABLE DATA, y compris les tables de config des extensions) restent.
              IMAGE_EXTENSIONS="fuzzystrmatch postgis postgis_tiger_geocoder postgis_topology"
              IMAGE_EXT_SCHEMAS="tiger tiger_data topology"
              absent="$(psql -X -v ON_ERROR_STOP=1 -tAc "select coalesce(string_agg(x, ' ' order by x), '') from unnest(string_to_array('$IMAGE_EXTENSIONS', ' ')) x where not exists (select 1 from pg_extension where extname = x)")" || { fin false "$toc" "postgres unreachable (extensions check)"; exit 1; }
              absent_ns="$(psql -X -v ON_ERROR_STOP=1 -tAc "select coalesce(string_agg(x, ' ' order by x), '') from unnest(string_to_array('$IMAGE_EXT_SCHEMAS', ' ')) x where not exists (select 1 from pg_namespace where nspname = x)")" || { fin false "$toc" "postgres unreachable (schemas check)"; exit 1; }
              if [ -n "$absent$absent_ns" ]; then
                fin false "$toc" "target lacks image extensions or schemas ($absent $absent_ns): postgis image not initialized, restore refused"; exit 2
              fi
              awk -v exts=" $IMAGE_EXTENSIONS " -v nss=" $IMAGE_EXT_SCHEMAS " '
                /^[0-9]+;/ && $5 == "-" && (($4 == "EXTENSION" && index(exts, " " $6 " ")) || ($4 == "COMMENT" && $6 == "EXTENSION" && index(exts, " " $7 " ")) ||
                  ($4 == "SCHEMA" && index(nss, " " $6 " ")) || ($4 == "COMMENT" && $6 == "SCHEMA" && index(nss, " " $7 " "))) { print ";" $0; next }
                { print }' /tmp/toc.txt > /tmp/restore.list || { fin false "$toc" "restore list not written"; exit 1; }
              excluded="$(grep -c '^;[0-9]' /tmp/restore.list || true)"
              user_tables="$(awk '/^[0-9]+;/ && $4 == "TABLE" && $5 != "DATA"' /tmp/restore.list | wc -l | tr -d ' ')"
              echo "[restore] liste -L : $excluded entree(s) exclue(s) (extensions/schemas de l'image), $user_tables table(s)"
              echo "[restore] pg_restore --clean --if-exists --single-transaction -> base=$PGDATABASE hote=$PGHOST"
              if ! pg_restore --clean --if-exists --no-owner --no-privileges \
                --exit-on-error --single-transaction \
                --use-list /tmp/restore.list \
                --dbname "$PGDATABASE" "/work/$DUMP_FILE"; then
                fin false "$toc" "pg_restore failed (single transaction rolled back: the previous state is kept)"; exit 1
              fi
              # Controle post-restauration (lecture seule) : postgis repond et chaque table de
              # la TOC existe (tables hors extensions). Un echec ici survient APRES le commit :
              # la raison dit de lancer le rollback G1.
              pgv="$(psql -X -v ON_ERROR_STOP=1 -tAc "select postgis_lib_version()")" || pgv=""
              got_tables="$(psql -X -v ON_ERROR_STOP=1 -tAc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where c.relkind in ('r','p') and n.nspname not in ('pg_catalog','information_schema') and n.nspname not like 'pg_toast%' and not exists (select 1 from pg_depend d where d.classid = 'pg_class'::regclass and d.objid = c.oid and d.deptype = 'e')")" || got_tables=""
              echo "[restore] sanite : postgis=$pgv tables=$got_tables attendu=$user_tables"
              if [ -z "$pgv" ] || [ "$got_tables" != "$user_tables" ]; then
                fin false "$toc" "post-restore check failed (postgis or table count): restore committed, run bascule.mjs pg-rollback (G1 snapshot)"; exit 1
              fi
              fin true "$toc" ""
              echo "[restore] OK - backup $BACKUP_DATE charge dans le postgis preprod"
          env:
            - { name: PGHOST, value: "${PG_SERVICE}" }
            - { name: PGPORT, value: "5432" }
            - { name: PGCONNECT_TIMEOUT, value: "10" }
            - { name: PGAPPNAME, value: "geo-bascule-pg-restore" }
            - { name: EXPECTED_DATABASE, value: "${EXPECTED_DATABASE}" }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: ${PG_SECRET}, key: POSTGRES_USER } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: ${PG_SECRET}, key: POSTGRES_PASSWORD } } }
            - { name: PGDATABASE, valueFrom: { secretKeyRef: { name: ${PG_SECRET}, key: POSTGRES_DB } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
