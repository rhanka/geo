# Ingress geo-api-preprod — host preprod dédié (jamais le host prod). Miroir prod :
# ingressClass traefik, issuer letsencrypt-prod, entrypoint websecure/tls. Le cert
# geo-api-preprod-tls est auto (cert-manager). L'enregistrement DNS-A du host =
# poc-k8s/owner (dépendance externe unique).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geo-api-preprod
  namespace: geo-preprod
  labels:
    app.kubernetes.io/name: geo-api-preprod
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api.preprod.geo.sent-tech.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geo-api-preprod
                port:
                  name: http
  tls:
    - hosts:
        - api.preprod.geo.sent-tech.ca
      secretName: geo-api-preprod-tls
