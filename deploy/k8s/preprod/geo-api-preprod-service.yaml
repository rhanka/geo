# Service geo-api-preprod — miroir EXACT du service prod : port 80 → targetPort http
# (le conteneur reste sur 8787). L'immo-proxy tape le svc:80 ; le netpol i-infra vise
# le POD 8787 après DNAT. Ne PAS exposer 8787 sur le service (miroir prod).
apiVersion: v1
kind: Service
metadata:
  name: geo-api-preprod
  namespace: geo-preprod
  labels:
    app.kubernetes.io/name: geo-api-preprod
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: geo-api-preprod
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
