# geo-api-preprod — tier de SERVING preprod (SPEC geo-preprod-serving / ADR-0027).
#
# OWNER-GATED : appliqué par poc-k8s dans la fenêtre gatée (i-cond S00 + netpol
# i-infra), jamais par socle. Miroir EXACT du deploy prod `geo-api` (deploy/k8s/
# geo-api-deployment.yaml) — seuls changent : namespace, nom/labels, la SOURCE S3
# (bucket séparé preprod) et le secret de creds preprod.
#
# Image = digest Scaleway PROD (interim) : geo-preprod runs EXACTEMENT l'image prod
# (S3-only via env) → promotion « même digest » réelle. GHCR-by-digest = cible en
# suivi (quand la PR GHCR gatée passe). Épinglage PAR DIGEST (jamais un tag mutable).
# Valeurs confirmées par poc-k8s ; ns/quota/secret/pull-secret/DNS-A = poc-k8s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-api-preprod
  namespace: geo-preprod
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: geo-api-preprod
    app.kubernetes.io/part-of: geo
    app.kubernetes.io/instance: preprod
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: geo-api-preprod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: geo-api-preprod
        app.kubernetes.io/part-of: geo
        app.kubernetes.io/instance: preprod
    spec:
      imagePullSecrets:
        - name: geo-registry-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: geo-api
          # Digest du build POST-MERGE de geo-api (embarque CE PR : expo coherence_id/
          # served_count/set_hash + le runner de sync). f8b152b1 (07-08) est ANTÉRIEUR au PR
          # → l'expo serait absente et la gate §4.1/§7 A5 inerte. UNE image, deux rôles
          # (serving + Job de sync). Minté par docker-publish depuis main (domaine release
          # socle) après merge ; résolu à l'apply par poc-k8s. Promotion « même digest » :
          # PREPROD_ACCEPTANCE → même digest en prod (expo conditionnelle/rétrocompat, safe).
          image: REPLACE_WITH_POST_MERGE_GEO_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: PORT
              value: "8787"
            # SOURCE preprod : bucket SÉPARÉ (isolation credential/bucket, sens-unique
            # §6.1 imposé au niveau IAM, pas par une prefix-policy OVH non vérifiée).
            - name: GEO_DATA_URI
              value: s3://sentropic-geo-preprod/normalized
            - name: NODE_ENV
              value: production
          # Creds S3 preprod (write preprod SEULEMENT, jamais prod) — Secret hors-repo
          # minté par poc-k8s. Même clés que prod (S3_ACCESS_KEY, S3_SECRET_KEY,
          # S3_BUCKET, S3_ENDPOINT, S3_REGION), scope preprod.
          envFrom:
            - secretRef:
                name: geo-s3-credentials-preprod
          livenessProbe:
            httpGet:
              path: /conformance
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /conformance
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
