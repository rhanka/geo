# Overlay PREPROD — serving geo-api dans le ns geo-preprod (main → deploy AUTO, ADR-0028).
# La CI deploy-preprod (C2) fait `kustomize edit set image geo-api=<registry>@<digest>` ici
# (résout le digest post-merge) puis `kubectl apply -k`. Le Job de récup (geo-preprod-sync)
# n'est PAS ici : c'est la jambe du cycle §6.1, appliquée par poc-k8s en fenêtre gatée
# (coherence_id partagé), pas à chaque merge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geo-preprod
# Nom `geo-api` dans le ns `geo-preprod` (le namespace différencie de la prod — pratique
# k8s standard). immo-preprod consomme le FQDN `geo-api.geo-preprod:8787` (in-cluster) ou le
# host ingress. PAS de nameSuffix : il casserait les SealedSecrets (C3, scellés liés au
# nom exact `geo-s3-credentials-preprod` → un suffixe romprait le sceau + l'envFrom).

resources:
  - ../../base
  - netpol.yaml
  # SealedSecrets S3 preprod (C3) — resources PLAINES (jamais suffixées : scellées au nom
  # exact ns+name). Le CD les applique → controller bitnami déchiffre → Secrets montés.
  - sealed-secrets.yaml

images:
  - name: geo-api
    newName: ghcr.io/rhanka/geo-api
    # Tag placeholder résolu par la CI en DIGEST post-merge (jamais un tag mutable en prod).
    newTag: REPLACE_WITH_POST_MERGE_GEO_DIGEST

patches:
  - path: patch-serving.yaml
  - target:
      kind: Ingress
      name: geo-api
    patch: |-
      # Host + TLS preprod (inchangé).
      - op: replace
        path: /spec/rules/0/host
        value: api.preprod.geo.sent-tech.ca
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.preprod.geo.sent-tech.ca
      - op: replace
        path: /spec/tls/0/secretName
        value: geo-api-preprod-tls
      # KEDA scale-to-zero : repointe le backend de l'Ingress du Service `geo-api` (port nommé
      # `http`) vers l'interceptor KEDA HTTP `keda-http-interceptor:8080`. C'est lui qui met la
      # requête en file et réveille geo-api depuis zéro réplica.
      #
      # ⚠ SÉQUENCE VITALE (corrigée avec k8s — la panne existe AUX DEUX BOUTS). MODÈLE pour les
      #   autres tenants : respecter l'ordre EXACT.
      #   1. Service keda-http-interceptor posé (i-cond).
      #   2. k8s pose l'objet d'échelle KEDA à min:1 (l'interceptor APPREND le host ; geo-api reste
      #      à 1 réplica, trafic direct ; impact nul — prérequis inoffensif). Mutation cluster → GO owner.
      #   3. CE repoint mergé → CD `kubectl apply -k` → Ingress live (chez geo, live DÈS le merge,
      #      pas de fenêtre de rattrapage : d'où min:1 AVANT le merge, pas après).
      #   4. k8s vérifie : backend == keda-http-interceptor:8080 ET host /conformance == 200.
      #   5. k8s passe min:1 → min:0 (scale-to-zero effectif).
      #   ✗ Repoint live SANS objet d'échelle (3 avant 2) = interceptor ignore le host = 404/503.
      #   ✗ min:0 avant que le repoint soit live = zéro réplica sans chemin de réveil = host tombe.
      #   Overlay PREPROD uniquement ; la PROD (api.geo.sent-tech.ca, overlay prod séparé) intouchée.
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: keda-http-interceptor
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port
        value:
          number: 8080
