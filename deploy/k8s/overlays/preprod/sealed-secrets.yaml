# SealedSecrets S3 preprod (C3, ADR-0028 §secrets). Produits par poc-k8s : mint OVH
# add-user par-bucket → kubeseal STRICT (liés ns+name `geo-preprod`, controller bitnami
# 0.37.0). Committés (chiffrés) → ferme le gap « creds live-only » ; le plaintext n'est
# JAMAIS dans le repo. Le CD (SA a `sealedsecrets`) les applique → le controller déchiffre
# → Secrets `geo-s3-credentials-*` (clés S3_ENDPOINT/S3_REGION/S3_ACCESS_KEY/S3_SECRET_KEY)
# que le serving (dest-only) et le Job de récup (source RO + dest) montent.
#
# ⚠ Scellés au nom EXACT : ne jamais renommer (nameSuffix retiré de l'overlay pour ça).
# Isolation A2 : dest RW `sentropic-geo-preprod` only / source RO `sentropic-geo` only
# (scope live des clés attesté poc-k8s : preprod OK / prod Forbidden).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: geo-s3-credentials-preprod
  namespace: geo-preprod
spec:
  encryptedData:
    S3_ACCESS_KEY: 
    S3_ENDPOINT: 
    S3_REGION: 
    S3_SECRET_KEY: 
  template:
    metadata:
      name: geo-s3-credentials-preprod
      namespace: geo-preprod
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: geo-s3-credentials-prod-ro
  namespace: geo-preprod
spec:
  encryptedData:
    S3_ACCESS_KEY: 
    S3_ENDPOINT: 
    S3_REGION: 
    S3_SECRET_KEY: 
  template:
    metadata:
      name: geo-s3-credentials-prod-ro
      namespace: geo-preprod
    type: Opaque
