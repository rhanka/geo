# Désactivé par défaut. Dupliquer/configurer une fois une lane validée : le
# renouvellement ne doit jamais démarrer une campagne implicite.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: geo-capture-refresh-REPLACE_ME
  namespace: geo
  labels:
    app: geo-capture
    app.kubernetes.io/part-of: geo
spec:
  schedule: "17 4 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: geo-capture
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: geo-registry-pull
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: capture
              image: rg.fr-par.scw.cloud/sentropic-geo/geo-capture:REPLACE_ME
              env:
                - name: LANE
                  value: "zones"
                - name: WORKLIST
                  value: "registry/capture-worklists/REPLACE_ME.json"
                - name: SHARD
                  value: "0"
                - name: SHARDS
                  value: "1"
                - name: DELAY_MS
                  value: "2000"
                - name: EGRESS
                  value: "direct"
                - name: MAX_BYTES
                  value: "104857600"
                - name: DRY_RUN
                  value: "0"
                - name: GEO_CAPTURE_EXECUTION
                  value: "cluster"
                - name: NODE_OPTIONS
                  value: "--dns-result-order=ipv4first"
                - name: AWS_MAX_ATTEMPTS
                  value: "10"
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              envFrom:
                - secretRef:
                    name: geo-s3-credentials
              resources:
                requests:
                  # Avec les services résidents, le quota laisse 395m de requêtes:
                  # six captures à 60m utilisent 360m.
                  cpu: 60m
                  # Le quota laisse 736Mi de requêtes mémoire après les services:
                  # six captures réservent 720Mi sans abaisser leur limite de 176Mi.
                  memory: 120Mi
                limits:
                  # Le quota laisse 900m de limites CPU: six captures à 150m
                  # atteignent ce plafond sans empêcher leur création.
                  cpu: 150m
                  # Capture streamée mesurée sur un règlement de 31,664,331 octets:
                  # pic cgroup 136.36 MiB. 176 Mi garde 39.64 Mi (29%) de marge.
                  memory: 176Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 4Gi
