# Template documenté du Job générique de capture (SPEC_CAPTURE_ON_CLUSTER §5.2).
#
# Ne pas appliquer les valeurs REPLACE_ME : l'orchestrateur TS génère un Job
# concret après avoir déposé la worklist en S3. Un Job Indexed borne la
# concurrence côté cluster, sans polling local; chaque pod reçoit son SHARD.
apiVersion: batch/v1
kind: Job
metadata:
  name: geo-capture-REPLACE_ME
  namespace: geo
  labels:
    app: geo-capture
    app.kubernetes.io/part-of: geo
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: geo-capture
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: geo-registry-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capture
          image: rg.fr-par.scw.cloud/sentropic-geo/geo-capture:REPLACE_ME
          imagePullPolicy: IfNotPresent
          env:
            - name: LANE
              value: "zones"
            - name: WORKLIST
              value: "registry/capture-worklists/REPLACE_ME.json"
            - name: RUN_STAMP
              value: "REPLACE_ME"
            - name: SHARD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: SHARDS
              value: "1"
            - name: DELAY_MS
              value: "2000"
            - name: EGRESS
              value: "direct"
            - name: MAX_BYTES
              value: "104857600"
            - name: DRY_RUN
              value: "0"
            - name: GEO_CAPTURE_EXECUTION
              value: "cluster"
            - name: NODE_OPTIONS
              value: "--dns-result-order=ipv4first"
            - name: AWS_MAX_ATTEMPTS
              value: "10"
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          envFrom:
            - secretRef:
                name: geo-s3-credentials
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 4Gi
