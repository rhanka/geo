# §9 stage-2 SERVE (light-gate). Runs the ratified cptaq-runner (#302 + #303 fast-follow) in the
# geo-api root image (gdal-bin). Light-gate = the runner's constructive guards (assertCptaqPreprodBucket +
# CAS-proof-bound-input + assertCptaqWritableKey + proof-v2 + no-PII); no design_sha/owner-go for
# the preprod-serve. Rendered per run from stage-1 capture output by render-cptaq-serve.ts; the render
# (name/label ≤63 bounds + placeholder substitution) is unit-tested in acquisition/src/lib/cptaq-serve-render.test.ts.
apiVersion: batch/v1
kind: Job
metadata:
  # metadata.name = cptaq-serve-<12hex sha256(runStamp)> (render). MUST be ≤63: a Job's pod template gets
  # an auto-injected `batch.kubernetes.io/job-name` label = metadata.name, and a label value >63 makes the
  # server-side apply reject the Job. Full run identity is kept in the run-id annotation (no length cap).
  name: cptaq-serve-REPLACE_JOB_SLUG
  namespace: geo-preprod
  annotations: { geo.sentropic/run-id: "REPLACE_RUN_ID" }
  labels: { app.kubernetes.io/component: constraints-serve, geo.stage: s9-cptaq-serve, geo.run: "REPLACE_JOB_SLUG" }
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/component: constraints-serve, geo.stage: s9-cptaq-serve, geo.run: "REPLACE_JOB_SLUG" }
    spec:
      restartPolicy: Never
      imagePullSecrets: [ { name: geo-registry-pull } ]
      containers:
      - name: cptaq-serve
        # geo-api ROOT image (gdal-bin, GDAL 3.6.2), built from main #309 merge
        # 9171ffa76cfd5ee856d16e3be4cac2e241f43ee7 (geo-socle/gdal-crs-version-robust) by CD Preprod run
        # 33709577514 (BUILD+PUSH+deploy-preprod = success; this IS the live preprod geo-api).
        # ≥#309 REQUIRED + VERIFIED: the CRS read is version-robust (`ogrinfo -ro -so` TEXT, no `-json`) —
        # a pre-#309 image (e.g. 83b67d0d) fails at runtime on GDAL 3.6.2's `Unknown option name '-json'`;
        # ≥#303 too (`_snapshots/` + `.meta.json` CC-BY). Digest = the containerimage.digest from the CD
        # build --metadata-file (i-infra; amd64-only single digest, no manifest-list), tag main-9171ffa76…,
        # cross-checked by a k8s in-image probe (dist/acquire/gdal.js: "Layer SRS WKT" ×2, no `-json`,
        # `_snapshots/` + `.meta.json` present).
        image: rg.fr-par.scw.cloud/sentropic-geo/geo-api@sha256:25bdd9d6d6905c447f68b0dea2fb4ddea472444a3472a9e4537d5b94737da00b
        # Prod image prunes tsx → run compiled dist. WORKDIR=/app (probe-verified self-exec + Usage guard).
        command: ["node","packages/geo/dist/constraints/cptaq-runner.js"]
        args:
          # raw-cas-key + capture-manifest-key substituted from stage-1's proof-bound output by
          # render-cptaq-serve.ts (never hand-typed; runner re-validates rawCasKey at runtime).
          - "--raw-cas-key"
          - "REPLACE_RAW_KEY"
          - "--capture-manifest-key"
          - "REPLACE_MANIFEST_KEY"
          - "--publish"
        env:
          # geo-s3-credentials has ENDPOINT/REGION/ACCESS/SECRET but NOT S3_BUCKET → inject explicitly.
          - { name: S3_BUCKET, value: "sentropic-geo-preprod" }
          # Cap the V8 old-space below the container limit so a GC pass reclaims before the cgroup
          # OOM-kills the pod. 2560Mi heap < 3Gi limit leaves headroom for GDAL native (off-heap) allocs.
          - { name: NODE_OPTIONS, value: "--max-old-space-size=2560" }
        envFrom:
          - { secretRef: { name: geo-s3-credentials } }   # ref only, no values
        resources:
          # GDAL on the province-wide ZA_transposee zip → generous mem (learned from §6 shard-10 OOM @176Mi).
          # 3Gi limit stays within the namespace quota (4Gi − 768Mi geo-api); NODE_OPTIONS caps the JS
          # heap at 2560Mi so GC runs before the cgroup OOM-kills, leaving ~500Mi for GDAL native + RSS.
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "1",    memory: "3Gi" }
# Served output (cptaq.test.ts): normalized/ca-qc-constraints/ca-qc-constraints-<slug>.geojson + .meta.json
#   for the 4 code-baked CPTAQ_PHASE1_CITIES (warden, saint-stanislas-de-kostka, sutton, coaticook); no --cities.
# Residency: geo-s3-credentials = deny-prod (i-infra probed) + assertCptaqWritableKey confines to
#   normalized/ca-qc-constraints/ → doubly held.
